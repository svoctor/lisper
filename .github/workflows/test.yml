name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Existing Rust sources are not rustfmt-clean; enforce formatting after the baseline cleanup.
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets
        continue-on-error: true

  browser:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.3.0
      - run: cargo update -p wasm-bindgen
      - run: wasm-pack build --out-dir ../lisper-web/pkg --target bundler
        working-directory: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: lisper-web
      - run: npm install
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
