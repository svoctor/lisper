# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build Rust lib
  build:
    name: Build Rust lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - uses: chrnorm/deployment-action@fe2fba14b486343ce6893cff73b80e153063917a # releases/v1
        name: Create GitHub deployment
        id: deployment
        with:
          token: "${{ github.token }}"
          target_url: https://lisper.victr.com
          environment: Production

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # pinned Rust toolchain action
        with:
          toolchain: '1.80.1'
      - name: Build Rust lib
        run: cargo build --workspace --locked
      - name: Test Rust lib
        run: cargo test --workspace --locked
    
    # Build WASM module
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: wasm-pack@0.13.1
          fallback: none
      - name: Build wasm
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cd wasm/
          wasm-pack build --out-dir ../lisper-web/pkg/ --target web
          mkdir -p ../lisper-web/public/wasm
          cp ../lisper-web/pkg/lisper_wasm.js ../lisper-web/pkg/lisper_wasm_bg.wasm ../lisper-web/public/wasm/
    
    # Deploy production build
      - uses: amondnet/vercel-action@2d78157ee070f28ff89dd4da74e0369fc26d3b34 # v20
        name: Deploy production
        id: deployment-production
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID}}
          vercel-project-id: ${{ secrets.PROJECT_ID}}
          vercel-args: '--prod'
          working-directory: ./lisper-web/

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: "${{ github.token }}"
          target_url: https://lisper.victr.com
          state: "success"
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # releases/v1
        with:
          token: "${{ github.token }}"
          target_url: https://lisper.victr.com
          state: "failure"
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
